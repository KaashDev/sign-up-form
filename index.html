<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.cdnfonts.com/css/20-db" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="img-container">
            <div class="logo-bar">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/LEGO_logo.svg/250px-LEGO_logo.svg.png">
                <img src="https://images.seeklogo.com/logo-png/15/2/wall-e-logo-png_seeklogo-151299.png">
                <h2>Hello!</h2>
            </div>
            <img src="https://images.unsplash.com/photo-1589254066007-898d52d910d3?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
        </div>
        <div class="user-info">
            <p>I designed this custom LEGO-inspired form project based on the movie WALL·E, combining playful colors, creative layouts, and interactive inputs to capture the charm, adventure, and futuristic feeling of the beloved animated story.</p>
            <form action="#">
                <h2>Tell us who you are!</h2>
                <section class="user-form">
                    <div class="row-one">
                        <div class="first-name">
                            <label for="first-name">First name <span>*</span></label>
                            <input type="text" id="first-name" required>
                        </div>
                        <div class="last-name">
                            <label for="last-name">Last name (Optional)</label>
                            <input type="text" id="last-name">
                        </div>
                    </div>
                    <div class="row-two">
                        <div class="email">
                            <label for="email">Email <span>*</span></label>
                            <input type="email" id="email" required>
                        </div>
                        <div class="phone">
                            <label for="phone">Phone number (Optional)</label>
                            <input type="phone" id="phone">
                        </div>
                    </div>
                    <div class="row-three">
                        <div class="password">
                            <label for="password">Password <span>*</span></label>
                            <input type="password" id="password" required>
                        </div>
                        <div class="repeat-password">
                            <label for="repeat-password">Repeat password <span>*</span></label>
                        <input type="password" id="repeat-password" required>
                        </div>
                    </div>
                </section>
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </form>
            
        </div>
    </div>
</body>
</html>
